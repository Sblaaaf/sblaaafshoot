services:
  app:
    build: .
    image: sblaaafshoot-dev
    working_dir: /app
    volumes:
      - .:/app
      # Volume nommé : les binaires natifs Linux (rolldown, esbuild…) ne
      # doivent pas se mélanger avec un éventuel node_modules macOS.
      - node_modules:/app/node_modules
    ports:
      - '5173:5173'
    env_file:
      - path: .env
        required: false

volumes:
  node_modules:
